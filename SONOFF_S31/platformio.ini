; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build outputs are bulk regenerable churn and must not sit in the Dropbox-synced repo tree.
; Set here rather than via PLATFORMIO_BUILD_DIR, which does not survive a new shell: the
; default .pio/ then silently comes back, and Dropbox's cloud filter holds handles on the
; archives it syncs, so ranlib fails with "unable to rename '...a'; reason: File exists".
; libdeps_dir is separate because build_dir does not cover it. Forward slashes: a native
; D:\... value loses its backslashes on the way through interpolation.
workdir = D:/WORK/PLUG
build_dir = ${platformio.workdir}/build
libdeps_dir = ${platformio.workdir}/libdeps
default_envs = espota
; WiFi fallback creds (WIFI_DEFAULT_SSID/PASS) injected from gitignored secrets.ini
; (copy secrets.ini.example). WITHOUT this a device with no LittleFS creds falls to
; SoftAP only and can be unreachable -- see C_ESP README's StaticWiFi_Conn note.
extra_configs = secrets.ini

[common]
; Fleet prefix, shared by every plug. NAME=${common.netname} is the fleet-OTA
; base name (all units pull <netname>.bin) AND the espota upload target's prefix.
; Each unit's addressable identity is avp::DeviceName(NAME) = "plug-XXYYZZ"
; (last 3 MAC bytes), derived at runtime in main.cpp -- one binary serves all.
netname = plug
build_flags = -std=gnu++17 -DDO_OTA=1 -DNO_STL=1 -DNAME=\"${common.netname}\" -DAVP_RAM_ATTR=IRAM_ATTR
  -DWIFI_DEFAULT_SSID=\"${secrets.wifi_ssid}\" -DWIFI_DEFAULT_PASS=\"${secrets.wifi_pass}\"
  -mtext-section-literals ;    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY -DWIFI_PHY_MODE=WIFI_PHY_MODE_11N
build_unflags = -std=gnu++11

[env:esp12e]
extends = common
platform = espressif8266
board = esp12e
board_build.ldscript = eagle.flash.4m1m.ld
framework = arduino
upload_port = COM12
board_build.filesystem = littlefs
monitor_speed = 74880
extra_scripts = pre:git_rev.py
; client.cpp provides HTTP_POST_puts, required by FleetServerDebug (the tee to bsd's Debug_log.csv)
build_src_filter = +<main.cpp> +<C_General/common_c.c> +<cse7766.cpp> +<C_ESP/client.cpp>
  +<C_General/common_cpp.cpp> +<C_ESP/common_esp.cpp> +<C_ARDUINO/common.cpp>
monitor_filters = esp8266_exception_decoder

[env:release]
extends = env:esp12e
build_type = release
build_flags = ${common.build_flags} -Os -DRELEASE=1 -DNDEBUG
build_unflags = ${common.build_unflags}

[env:debug]
extends = env:esp12e
build_type = debug
build_flags = ${common.build_flags} -Og -ggdb3  -g3 -DDEBUG=1
build_unflags = ${common.build_unflags}

[env:espota]
extends = env:release
upload_protocol = espota
upload_port = ${common.netname}
; upload_port = 192.168.50.199
; upload_port = 192.168.4.1
build_unflags = ${common.build_unflags}