; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
build_flags = -O3 -DDO_OTA=1
build_unflags = -Os -O0
upload_port = COM8
monitor_speed = 115200

[env:release]
extends = env:esp12e
build_type = release
build_flags = -Os -DRELEASE=1 -DBOARD_HAS_PSRAM=1
build_unflags = -O0

[env:debug]
extends = env:esp12e
build_type = debug
build_flags = -Og -DDEBUG=1 -DBOARD_HAS_PSRAM=1 -DDEBUG_ESP_OTA=1 -DDEBUG_ESP_PORT=Serial
build_unflags = -Os -O3

[env:espota]
extends = env:debug
upload_protocol = espota
upload_port = 192.168.50.16
