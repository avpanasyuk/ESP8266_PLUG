; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = espota

[common]
netname = plug4
build_flags = -DDO_OTA=1 -DNO_STL=1 -DELEGANTOTA_USE_ASYNC_WEBSERVER=0 -DNAME=\"${common.netname}\"
board_build.filesystem = littlefs

[env:esp12e]
extends = common
platform = espressif8266
board = esp12e
framework = arduino
upload_port = COM8
monitor_speed = 115200
lib_deps = 
  ESP8266WebServer
  ayushsharma82/ElegantOTA@^3.1.7

[env:release]
extends = env:esp12e
build_type = release
build_flags = ${common.build_flags} -Os -DRELEASE=1
build_unflags = -Og

[env:debug]
extends = env:esp12e
build_type = debug
build_flags = ${common.build_flags} -Og -ggdb3  -g3 -DDEBUG=1
build_unflags = -Os -O3

[env:espota]
extends = env:release
upload_protocol = espota
upload_port = ${common.netname}
