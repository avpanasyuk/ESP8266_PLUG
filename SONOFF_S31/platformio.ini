; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = espota

[common]
netname = plug1
build_flags = -std=gnu++17 -DDO_OTA=1 -DNO_STL=1 -DNAME=\"${common.netname}\" -DAVP_RAM_ATTR=IRAM_ATTR
  -mtext-section-literals
build_unflags = -std=gnu++11

[env:esp12e]
extends = common
platform = espressif8266
board = esp12e
framework = arduino
upload_port = COM7
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<main.cpp> +<C_General/common_c.c> +<cse7766.cpp> 
  +<C_General/common_cpp.cpp> +<C_ESP/common_esp.cpp> +<C_ARDUINO/common.cpp>

[env:release]
extends = env:esp12e
build_type = release
build_flags = ${common.build_flags} -Os -DRELEASE=1
build_unflags = ${common.build_unflags}

[env:debug]
extends = env:esp12e
build_type = debug
build_flags = ${common.build_flags} -Og -ggdb3  -g3 -DDEBUG=1
build_unflags = ${common.build_unflags}

[env:espota]
extends = env:release
upload_protocol = espota
upload_port = ${common.netname}
build_unflags = ${common.build_unflags}